name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows / MSVC / Qt ${{ matrix.qt }} / ${{ matrix.config }}
    # Needs Visual Studio 2022; pin to windows-2022 if the image drops it.
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - qt: '6.6.2'
            config: Release
          - qt: '6.6.2'
            config: Debug

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtshadertools
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # No CMAKE_C_COMPILER: the project declares LANGUAGES CXX.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # This job's own build directory is a real .ninja_log to analyse.
      - name: Smoke-test bw_cli against this build
        run: |
          $out = ./build/bin/bw_cli.exe analyze build --top 10
          if ($LASTEXITCODE -ne 0) { throw "bw_cli analyze failed" }
          $out
          # build/ is one level under the source root, the depth the fallback
          # source-root guess gets wrong.
          if ($out -match '\[external\]/(apps|libs|tools)/') {
            throw "source root was not inferred: our own files landed in [external]"
          }
          ./build/bin/bw_cli.exe --version
          ./build/bin/bw_cli.exe analyze build --csv "$env:RUNNER_TEMP/targets.csv" --json "$env:RUNNER_TEMP/analysis.json"
          if (-not (Test-Path "$env:RUNNER_TEMP/targets.csv")) { throw "--csv wrote nothing" }
          $json = Get-Content "$env:RUNNER_TEMP/analysis.json" -Raw | ConvertFrom-Json
          if ($json.schema -ne 'build-weather/analysis/1') { throw "unexpected JSON schema: $($json.schema)" }

      # 2 for a bad command line, 1 for unreadable input, 0 otherwise.
      - name: Check bw_cli exit codes
        run: |
          # Most of these exit non-zero on purpose, and a pwsh step otherwise
          # both throws on that and ends with `exit $LASTEXITCODE`.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $failures = 0
          function Expect-Exit([string]$label, [int]$expected, [string[]]$cliArgs) {
            & ./build/bin/bw_cli.exe @cliArgs *> $null
            $code = $LASTEXITCODE
            if ($code -ne $expected) {
              Write-Host "FAIL  $label : expected exit $expected, got $code"
              $script:failures++
            } else {
              Write-Host "ok    $label (exit $code)"
            }
          }

          Expect-Exit "flag with no value" 2 @('analyze','build','--csv')
          Expect-Exit "non-numeric --top"  2 @('analyze','build','--top','abc')
          Expect-Exit "unknown option"     2 @('analyze','build','--nope')
          Expect-Exit "unknown command"    2 @('frobnicate')
          Expect-Exit "no command"         2 @()
          Expect-Exit "unreadable input"   1 @('analyze','build/does-not-exist')
          Expect-Exit "--help"             0 @('--help')
          Expect-Exit "--version"          0 @('--version')
          Expect-Exit "valid analyze"      0 @('analyze','build','--top','1')

          if ($failures -gt 0) { Write-Host "$failures check(s) failed"; exit 1 }
          Write-Host "all exit codes correct"
          exit 0

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.config }}
          path: build/Testing/
          if-no-files-found: ignore
